version: 2

models:
  - name: dim_customers
    description: Dimension client. Grain = customer_id (un identifiant par commande) ; customer_unique_id regroupe les commandes d'une même personne.
    columns:
      - name: customer_id
        description: Clé primaire.
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identifiant stable de la personne physique.
        data_tests:
          - not_null
      - name: zip_code_prefix
        description: Préfixe du code postal (VARCHAR).
      - name: city
        description: Ville.
      - name: state
        description: État brésilien (2 lettres).
      - name: latitude
        description: Latitude moyenne du préfixe postal (NULL si préfixe absent de la géolocalisation).
      - name: longitude
        description: Longitude moyenne du préfixe postal.

  - name: dim_sellers
    description: Dimension vendeur, avec coordonnées moyennes de son préfixe postal.
    columns:
      - name: seller_id
        description: Clé primaire.
        data_tests:
          - unique
          - not_null
      - name: zip_code_prefix
        description: Préfixe du code postal (VARCHAR).
      - name: city
        description: Ville.
      - name: state
        description: État brésilien (2 lettres).
      - name: latitude
        description: Latitude moyenne du préfixe postal.
      - name: longitude
        description: Longitude moyenne du préfixe postal.

  - name: dim_products
    description: Dimension produit avec catégorie en anglais (repli portugais, puis 'unknown').
    columns:
      - name: product_id
        description: Clé primaire.
        data_tests:
          - unique
          - not_null
      - name: category_name
        description: Catégorie finale, jamais NULL.
        data_tests:
          - not_null
      - name: category_name_pt
        description: Catégorie d'origine en portugais.
      - name: product_weight_g
        description: Poids en grammes.

  - name: dim_date
    description: Calendrier quotidien 2016-2018, généré avec dbt_utils.date_spine.
    columns:
      - name: date_day
        description: Clé primaire (date).
        data_tests:
          - unique
          - not_null
      - name: year
        description: Année.
      - name: quarter
        description: Trimestre (1-4).
      - name: month
        description: Mois (1-12).
      - name: month_name
        description: Nom abrégé du mois.
      - name: month_start_date
        description: Premier jour du mois (utile pour les axes temporels Power BI).
      - name: week_of_year
        description: Numéro de semaine.
      - name: day_of_week
        description: Jour de la semaine ISO (1 = lundi, 7 = dimanche).
      - name: day_name
        description: Nom abrégé du jour.
      - name: is_weekend
        description: Vrai pour samedi et dimanche.

  - name: fct_orders
    description: Table de faits commandes. Grain = 1 ligne par commande.
    columns:
      - name: order_id
        description: Clé primaire.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Clé étrangère vers dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        description: Statut de la commande.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['created', 'approved', 'invoiced', 'processing', 'shipped', 'delivered', 'unavailable', 'canceled']
      - name: purchased_at
        description: Horodatage de l'achat.
      - name: purchase_date
        description: Date d'achat, clé étrangère vers dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivered_date
        description: Date de livraison au client (NULL si non livrée), clé étrangère vers dim_date.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: estimated_delivery_date
        description: Date de livraison promise, clé étrangère vers dim_date.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: delivery_days_actual
        description: Jours entre achat et livraison réelle (NULL si non livrée).
      - name: delivery_days_estimated
        description: Jours entre achat et livraison estimée.
      - name: delivery_delay_days
        description: Livraison réelle moins estimée, en jours. Positif = en retard.
      - name: is_delivered_late
        description: Vrai si livrée après la date estimée (NULL si non livrée).
      - name: items_count
        description: Nombre d'articles (0 si aucun).
      - name: items_amount
        description: Montant des produits (BRL).
      - name: freight_amount
        description: Frais de port (BRL).
      - name: payment_amount
        description: Montant total payé (BRL).
      - name: payments_count
        description: Nombre de paiements.
      - name: main_payment_type
        description: Type de paiement principal.
      - name: review_score
        description: Note de l'avis le plus récent, de 1 à 5 (NULL si pas d'avis).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: fct_order_items
    description: Table de faits articles. Grain = 1 ligne par article de commande.
    columns:
      - name: order_item_key
        description: Clé primaire de substitution (hash de order_id + order_item_id).
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Clé étrangère vers fct_orders.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: order_item_id
        description: Numéro de l'article dans la commande.
        data_tests:
          - not_null
      - name: product_id
        description: Clé étrangère vers dim_products.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        description: Clé étrangère vers dim_sellers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_id
        description: Clé étrangère vers dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: purchase_date
        description: Date d'achat, clé étrangère vers dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: order_status
        description: Statut de la commande parente.
      - name: price
        description: Prix de l'article (BRL).
      - name: freight_value
        description: Frais de port de l'article (BRL).
      - name: total_item_amount
        description: Prix + frais de port (BRL).
